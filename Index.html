<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Travel Notification System</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>
body {
    background: #0f172a;
}
</style>

</head>

<body class="text-white">

<div class="max-w-3xl mx-auto mt-10 p-6 bg-slate-900 rounded-xl shadow-lg">

<h1 class="text-2xl font-bold mb-6 text-center">
Travel WhatsApp Notification System
</h1>

<!-- INPUT SECTION -->

<div class="mb-4">

<label class="block mb-2">Enter PNR</label>

<div class="flex gap-2">

<input 
id="pnr"
type="text"
placeholder="Example: ABC123"
class="w-full p-3 rounded bg-slate-800 border border-slate-600">

<button 
onclick="fetchPNR()"
class="bg-blue-600 px-4 py-2 rounded hover:bg-blue-700">

Fetch

</button>

</div>

</div>


<div class="mb-4">

<label class="block mb-2">OR Upload Ticket</label>

<input 
type="file"
class="w-full p-2 bg-slate-800 rounded border border-slate-600">

</div>


<hr class="my-6 border-slate-700">


<!-- PASSENGER INFO -->

<h2 class="text-xl mb-4">Passenger Information</h2>

<div class="grid grid-cols-2 gap-4">

<input id="name" placeholder="Customer Name"
class="p-2 bg-slate-800 rounded border border-slate-600">

<input id="phone" placeholder="Phone Number"
class="p-2 bg-slate-800 rounded border bordera border-slate-600">

<input id="departure" placeholder="Departure Airport"
class="p-2 bg-slate-800 rounded border border-slate-600">

<input id="arrival" placeholder="Arrival Airport"
class="p-2 bg-slate-800 rounded border border-slate-600">

<input id="flight" placeholder="Flight Number"
class="p-2 bg-slate-800 rounded border border-slate-600">

<input id="departureTime" type="datetime-local"
class="p-2 bg-slate-800 rounded border border-slate-600"
onchange="calculateCheckin()">

<input id="checkinTime" placeholder="Check-in Time"
class="p-2 bg-slate-700 rounded border border-slate-600" readonly>

</div>


<hr class="my-6 border-slate-700">


<!-- MESSAGE PREVIEW -->

<h2 class="text-xl mb-4">WhatsApp Message Preview</h2>

<textarea
id="message"
class="w-full h-40 p-3 bg-slate-800 rounded border border-slate-600">
</textarea>


<button
onclick="generateMessage()"
class="mt-4 bg-green-600 px-4 py-2 rounded hover:bg-green-700">

Generate Message

</button>


<button
onclick="sendWhatsApp()"
class="mt-4 ml-4 bg-blue-600 px-4 py-2 rounded hover:bg-blue-700">

Send WhatsApp

</button>


</div>

<script src="script.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Travel Notification System</title>

<script src="https://cdn.tailwindcss.com"></script>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

body{
font-family:'Inter',sans-serif;
background: linear-gradient(135deg,#0f172a,#020617);
}

.card{
background: rgba(15,23,42,0.9);
backdrop-filter: blur(12px);
border-radius:16px;
padding:28px;
max-width:1100px;
width:100%;
box-shadow:0 0 40px rgba(0,0,0,0.4);
}

.input{
background:#1e293b;
border:1px solid rgba(255,255,255,0.08);
border-radius:12px;
padding:12px;
width:100%;
}

.input:focus{
outline:none;
border-color:#3b82f6;
}

.label{
font-size:12px;
color:#94a3b8;
margin-bottom:4px;
}

.button{
background: linear-gradient(to right,#3b82f6,#1e3a8a);
border-radius:12px;
padding:12px;
font-weight:500;
transition:0.2s;
}

.button:hover{
background: linear-gradient(to right,#2563eb,#1e40af);
}

.autofilled{
border-color:#22c55e !important;
background:#052e16 !important;
}

</style>

</head>

<body class="text-white min-h-screen flex items-center justify-center p-4">


<div class="card">

<!-- HEADER -->

<div class="flex items-center mb-6">

<img src="logo.png" class="h-12 mr-4">

<h1 class="text-xl font-semibold">
Travel Notification System
</h1>

</div>



<!-- UPLOAD -->

<div class="mb-6">

<div class="label">Upload Ticket</div>

<input type="file"
id="ticketFile"
class="input">

<button onclick="uploadTicket()"
class="button mt-3 w-full">

Extract Ticket Information

</button>

</div>



<!-- CUSTOMER INFO -->

<div class="grid grid-cols-1 md:grid-cols-2 gap-4">


<div>

<div class="label">Passenger Name</div>

<input id="name" class="input">

</div>


<div>

<div class="label">Phone Number</div>

<input id="phone" class="input">

</div>


<div>

<div class="label">PNR</div>

<input id="pnr" class="input">

</div>


<div>

<div class="label">Ticket Number</div>

<input id="ticketNumber" class="input">

</div>


<div>

<div class="label">Airline</div>

<input id="airline" class="input">

</div>


<div>

<div class="label">Flight Number</div>

<input id="flight" class="input">

</div>


<div>

<div class="label">Departure Airport</div>

<input id="departure" class="input">

</div>


<div>

<div class="label">Arrival Airport</div>

<input id="arrival" class="input">

</div>


<div>

<div class="label">Departure Time</div>

<input id="departureTime"
type="datetime-local"
class="input"
onchange="calculateCheckin()">

</div>


<div>

<div class="label">Check-in Time</div>

<input id="checkinTime"
class="input"
readonly>

</div>


<div>

<div class="label">Cabin Baggage</div>

<input id="cabin" class="input">

</div>


<div>

<div class="label">Checked Baggage</div>

<input id="checked" class="input">

</div>


</div>



<!-- MESSAGE -->

<div class="mt-6">

<div class="label">WhatsApp Message</div>

<textarea id="message"
class="input h-40">

</textarea>

</div>



<!-- BUTTONS -->

<div class="grid grid-cols-2 gap-4 mt-4">

<button onclick="generateMessage()"
class="button">

Generate Message

</button>


<button onclick="sendWhatsApp()"
class="button">

Send WhatsApp

</button>

</div>



<div id="status"
class="text-center mt-4 text-slate-400">

Ready

</div>


</div>

<script src="script.js"></script>

</body>
</html>
